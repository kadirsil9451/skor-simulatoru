name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 imajında Android SDK hazır kurulu gelir
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK'yı hazırla
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          ls "$SDK" || { echo "Android SDK bulunamadı"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: APK'yı derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk SkorSimulatoru.apk

      - name: Actions çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SkorSimulatoru-apk
          path: SkorSimulatoru.apk

      - name: "Releases > latest sayfasına koy"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Skor Simülatörü (son sürüm)
          body: "Telefondan bu sayfayı açıp SkorSimulatoru.apk dosyasını indir ve kur. Derleme: ${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: SkorSimulatoru.apk
