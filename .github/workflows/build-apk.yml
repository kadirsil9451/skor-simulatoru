name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: APK'yı derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk SkorSimulatoru.apk

      - name: Actions çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SkorSimulatoru-apk
          path: SkorSimulatoru.apk

      - name: "Releases > latest sayfasına koy"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Skor Simülatörü (son sürüm)
          body: "Telefondan bu sayfayı açıp SkorSimulatoru.apk dosyasını indir ve kur. Derleme: ${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: SkorSimulatoru.apk
