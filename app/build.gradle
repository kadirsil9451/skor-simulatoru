plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macsim.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.macsim.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Sabit imza: her derlemede aynı anahtar, böylece güncellemeler eskisinin üzerine kurulur
    signingConfigs {
        debug {
            storeFile file('skor.keystore')
            storePassword 'skorsim'
            keyAlias 'skor'
            keyPassword 'skorsim'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
